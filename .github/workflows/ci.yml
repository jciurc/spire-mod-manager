# CI for pull requests (into dev) and pushes to dev and main.
#
# checks: on GitHub's hosted Linux runners, the offline checks (tools/check.cs) and a compile of the tool
#   scripts without running them. The mod itself can't build there: it compiles against the game's own
#   sts2.dll and Godot assemblies, which are proprietary and never committed.
# selftest: the in-game self-test on Jordan's PC, a self-hosted runner with the game installed. It runs only
#   when the repository variable SELF_HOSTED_STS2 is 'true' (see README.md, "CI"). Never --real: that
#   output holds Jordan's own mods and data.
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Offline checks
        run: dotnet run tools/check.cs
      # dotnet build on a .cs file compiles the file-based app and stops there; nothing runs.
      - name: Compile the tool scripts
        run: |
          for script in build.cs tools/dev.cs tools/pck.cs tools/check.cs; do
            dotnet build "$script"
          done

  selftest:
    if: vars.SELF_HOSTED_STS2 == 'true'
    needs: checks
    runs-on: [self-hosted, windows, sts2]
    steps:
      - uses: actions/checkout@v7
      - name: Build (no install)
        id: build
        run: dotnet run build.cs --no-install
      # Each dev.cs run rebuilds and so clears out/, so each run's results are uploaded before the next.
      - name: Self-test (fixture mods)
        id: fixture
        run: dotnet run tools/dev.cs test
      - name: Upload fixture results
        if: ${{ !cancelled() && steps.fixture.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: selftest-fixture
          path: |
            out/selftest/*.txt
            out/dev.log
          retention-days: 14
      - name: Self-test alongside Better Mod Menu
        id: bmm
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run tools/dev.cs test --bmm
      - name: Upload Better Mod Menu results
        if: ${{ !cancelled() && steps.bmm.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: selftest-bmm
          path: |
            out/selftest/*.txt
            out/dev.log
          retention-days: 14
