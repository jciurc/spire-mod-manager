# CI for pull requests into dev and main, and pushes to them.
#
# checks: on GitHub's hosted Linux runners, the offline checks (tools/check.cs) and a compile of the tool
#   scripts without running them. The mod itself can't build there: it compiles against the game's own
#   sts2.dll and Godot assemblies, which are proprietary and never committed.
# The in-game self-test is selftest.yml, started by hand only.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Offline checks
        run: dotnet run tools/check.cs
      # dotnet build on a .cs file compiles the file-based app and stops there; nothing runs.
      - name: Compile the tool scripts
        run: |
          for script in build.cs tools/dev.cs tools/pck.cs tools/check.cs tools/shot.cs tools/watchdog.cs; do
            dotnet build "$script"
          done
