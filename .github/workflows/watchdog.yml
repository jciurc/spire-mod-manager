# Watchdog: every 30 minutes, tools/watchdog.cs counts what outside accounts opened and commented in the last
# hour. On a flood it locks the conversations they touched and opens a "watchdog" issue (see the script).
# Off until the repository variable WATCHDOG is "on": set it when the repository goes public (while private,
# outsiders can't reach it and each run would cost Actions minutes). Run it by hand from the Actions tab for
# a dry run at any time.
name: Watchdog

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report only, change nothing
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: watchdog
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  watchdog:
    if: vars.WATCHDOG == 'on' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Count and, on a flood, lock
        run: dotnet run tools/watchdog.cs ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && '--dry-run' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
